<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Game</title>
    <link rel="stylesheet" href="style.css">
    <!-- link of cdn of font Awesome  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- link of googdle fonts  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

<body>
    <!-- create container and use {h1 & h4 & button & para &}  -->
    <div class="container">
        <h1>Mind Game<i class="fa-solid fa-brain"></i></h1>
        <h4 class="nameTitle" id="show-greet"></h4>
        <button id="restart-button">Restart</button>
        <P class="guide"><i class="fa-solid fa-diamond"></i>Match All Box<i class="fa-solid fa-diamond icon-1"></i></P>
        <div class="game-board" id="game-board"></div>
    </div>
    <script src="script.js"></script>

</html>
